name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - METHODOLOGY.md
      - SECURITY.md
      - REPORTING_POLICY.md
      - HIDDEN_SUITE_ARCHITECTURE.md
      - RELEASE_CHECKLIST.md
      - PROVENANCE.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tags are used below until maintainers record reviewed immutable SHAs.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp docs/index.html _site/index.html
          cp README.md METHODOLOGY.md SECURITY.md REPORTING_POLICY.md HIDDEN_SUITE_ARCHITECTURE.md RELEASE_CHECKLIST.md PROVENANCE.json CITATION.cff LICENSE NOTICE _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
